name: Android

# Builds a debug APK and runs it on an emulator against the built-in test
# mail server: the app must start, add an account and show the inbox.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  emulator:
    name: Emulator smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-linux-android
      - run: bun install --frozen-lockfile
      - name: Android project and icons
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bun run tauri android init --ci
          bun run tauri icon src-tauri/icons/icon.png
      - name: Build the debug APK (x86_64, for the emulator)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bun run tauri android build --apk --debug --target x86_64
      - name: Start the test mail server
        run: |
          cargo build -p lowmail-server --features demo
          LOWMAIL_LISTEN=127.0.0.1:8480 LOWMAIL_DATA_DIR="$RUNNER_TEMP/demo" nohup ./target/debug/lowmail demo > "$RUNNER_TEMP/demo.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8480/healthz && break; sleep 1; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/android_smoke.sh "$RUNNER_TEMP/android"
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-smoke
          path: ${{ runner.temp }}/android
          if-no-files-found: warn
