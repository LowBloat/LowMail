name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Version files match the tag
        id: version
        run: bun scripts/check-version.mjs "$RELEASE_TAG"

  # Same checks as every push, run against the tagged code before any
  # installer is built.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  # The app started on an Android emulator, signed in to a test mail server.
  android-check:
    name: Android emulator
    uses: ./.github/workflows/android.yml

  windows:
    name: Windows x64
    needs: [verify, checks]
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: bun install --frozen-lockfile
      - name: Build with Tauri
        run: bun run tauri build
      - name: Collect installers and portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "out" | Out-Null

          $nsis = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found." }
          Copy-Item $nsis.FullName "out/LowMail-$env:VERSION-windows-x64-setup.exe"
          Copy-Item "$($nsis.FullName).sig" "out/LowMail-$env:VERSION-windows-x64-setup.exe.sig"

          $msi = Get-ChildItem "target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "out/LowMail-$env:VERSION-windows-x64.msi"
            Copy-Item "$($msi.FullName).sig" "out/LowMail-$env:VERSION-windows-x64.msi.sig"
          }

          $portable = "out/LowMail-$env:VERSION-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "target/release/lowmail-desktop.exe" "$portable/LowMail.exe"
          Copy-Item README.md, LICENSE $portable
          Compress-Archive -Path "$portable/*" -DestinationPath "$portable.zip" -Force
          Remove-Item -Recurse -Force $portable

          Get-ChildItem out -File -Exclude *.sig | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii -NoNewline
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lowmail-windows
          path: out/*
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: [verify, checks]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install system libraries (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev libappindicator3-dev \
            librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: bun install --frozen-lockfile
      - name: Build with Tauri
        run: bun run tauri build
      - name: Build the webmail server
        run: cargo build --release --locked -p lowmail-server
      - name: Collect packages, portable build and webmail server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          bundle=target/release/bundle
          cp "$(find $bundle/deb -name '*.deb' | head -n 1)" "out/LowMail-${VERSION}-linux-x64.deb"
          cp "$(find $bundle/rpm -name '*.rpm' | head -n 1)" "out/LowMail-${VERSION}-linux-x64.rpm"
          appimage="$(find $bundle/appimage -name '*.AppImage' | head -n 1)"
          cp "$appimage" "out/LowMail-${VERSION}-linux-x64.AppImage"
          cp "$appimage.sig" "out/LowMail-${VERSION}-linux-x64.AppImage.sig"

          portable="out/LowMail-${VERSION}-linux-x64-portable"
          mkdir -p "$portable"
          cp target/release/lowmail-desktop "$portable/LowMail"
          chmod +x "$portable/LowMail"
          cp README.md LICENSE "$portable/"
          tar -czf "$portable.tar.gz" -C "$portable" .
          rm -rf "$portable"

          # The webmail (Roundcube replacement) as a single binary.
          webmail="out/LowMail-${VERSION}-webmail-linux-x64"
          mkdir -p "$webmail"
          cp target/release/lowmail "$webmail/lowmail"
          cp README.md LICENSE docs/roundcube.pt-BR.md "$webmail/"
          tar -czf "$webmail.tar.gz" -C "$webmail" .
          rm -rf "$webmail"

          # Native Arch Linux package (pacman -U), built with makepkg in an
          # Arch container from the binary compiled above.
          arch_build="$PWD/arch-build"
          mkdir -p "$arch_build"
          cp target/release/lowmail-desktop "$arch_build/lowmail-desktop"
          cp src-tauri/icons/128x128.png "$arch_build/lowmail.png"
          cp packaging/arch/lowmail.desktop "$arch_build/lowmail.desktop"
          python3 .github/scripts/render_pkgbuild.py local "$VERSION" "$arch_build"
          docker run --rm -v "$arch_build":/workspace -w /workspace archlinux:base-devel bash -c "
            useradd -m builder && chown -R builder:builder /workspace &&
            su builder -c 'makepkg -f --nodeps'
          "
          cp "$(find "$arch_build" -name '*.pkg.tar.zst' | head -n 1)" "out/LowMail-${VERSION}-linux-x86_64.pkg.tar.zst"
          sudo rm -rf "$arch_build"

          (cd out && for f in *; do [[ "$f" == *.sig ]] || sha256sum "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lowmail-linux
          path: out/*
          if-no-files-found: error

  webmail-arm64:
    name: Webmail server Linux ARM64
    needs: [verify, checks]
    runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cargo build --release --locked -p lowmail-server
      - name: Collect the webmail server
        shell: bash
        run: |
          set -euo pipefail
          webmail="out/LowMail-${VERSION}-webmail-linux-arm64"
          mkdir -p "$webmail"
          cp target/release/lowmail "$webmail/lowmail"
          cp README.md LICENSE docs/roundcube.pt-BR.md "$webmail/"
          tar -czf "$webmail.tar.gz" -C "$webmail" .
          rm -rf "$webmail"
          (cd out && for f in *; do sha256sum "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lowmail-webmail-arm64
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS universal (Apple Silicon + Intel)
    needs: [verify, checks]
    runs-on: macos-14
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: bun install --frozen-lockfile
      - name: Build with Tauri (universal)
        run: bun run tauri build --target universal-apple-darwin
      - name: Collect DMG and updater bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          bundle=target/universal-apple-darwin/release/bundle
          dmg=$(find $bundle/dmg -name '*.dmg' | head -n 1)
          cp "$dmg" "out/LowMail-${VERSION}-macos-universal.dmg"
          tarball=$(find $bundle/macos -name '*.app.tar.gz' | head -n 1)
          cp "$tarball" "out/LowMail-${VERSION}-macos-universal.app.tar.gz"
          cp "$tarball.sig" "out/LowMail-${VERSION}-macos-universal.app.tar.gz.sig"
          (cd out && for f in *; do [[ "$f" == *.sig ]] || shasum -a 256 "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lowmail-macos
          path: out/*
          if-no-files-found: error

  android:
    name: Android (arm64, armv7, x86_64)
    needs: [verify, checks]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: bun install --frozen-lockfile
      - name: Android project and icons
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bash .github/scripts/android_project.sh
      - name: Build the APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bun run tauri android build --apk --target aarch64 armv7 x86_64
      - name: Align and sign
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -n 1)
          keystore="$RUNNER_TEMP/lowmail.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          mkdir -p out
          apk="out/LowMail-${VERSION}-android-universal.apk"
          "$tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias lowmail --v4-signing-enabled false \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$keystore"
          "$tools/apksigner" verify --print-certs "$apk" | head -n 3
          (cd out && for f in *.apk; do sha256sum "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lowmail-android
          path: out/*
          if-no-files-found: error

  image:
    name: Webmail image
    needs: [verify, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lowbloat/lowmail:${{ needs.verify.outputs.version }}
            ghcr.io/lowbloat/lowmail:latest

  publish:
    name: Publish to GitHub Releases
    needs: [verify, android-check, windows, linux, webmail-arm64, macos, android, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Build provenance attestations (Sigstore) for every published file.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-assets
          pattern: lowmail-*
          merge-multiple: true
      - name: Create the draft release if it does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # A maintainer usually writes the notes in a draft before the build
          # finishes; otherwise GitHub generates them from merged pull requests.
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --generate-notes --draft --title "LowMail $VERSION"
          fi
      - name: Write the updater manifest (latest.json)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: python3 .github/scripts/update_manifest.py
      - name: Write the Arch PKGBUILD (AUR recipe with real checksums)
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: python3 .github/scripts/render_pkgbuild.py release "$VERSION" release-assets
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/LowMail-${{ needs.verify.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'SHA256SUMS' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-assets/LowMail-*
            release-assets/latest.json
            release-assets/PKGBUILD
            release-assets/SHA256SUMS
      - name: Upload files and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-assets -maxdepth 1 -type f)
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
