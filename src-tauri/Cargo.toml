[package]
name = "lowmail-desktop"
description = "LowMail desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between the binary and the library on Windows.
name = "lowmail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lowmail-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lowmail-core.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
parking_lot.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
percent-encoding = "2"
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
# Passwords in the OS credential store. Exact pin, like the other LowBloat apps.
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[lints]
workspace = true
