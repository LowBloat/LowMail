[package]
name = "lowmail-server"
description = "LowMail webmail server: the LowMail interface for any IMAP/SMTP server, in the browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "lowmail"
path = "src/main.rs"

[features]
default = []
# Bundles the in-memory test mail server for `lowmail demo`.
demo = ["dep:lowmail-testserver"]

[dependencies]
lowmail-core.workspace = true
lowmail-testserver = { path = "../lowmail-testserver", optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
parking_lot.workspace = true
base64.workspace = true
rand.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "set-header", "limit", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
sha2 = "0.10"
percent-encoding = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "multipart", "rustls-tls"] }
lowmail-testserver = { path = "../lowmail-testserver" }
